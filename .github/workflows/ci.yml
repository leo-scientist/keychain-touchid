name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: make lint
      - run: make test
      - run: make smoke
      - name: Staged install (DESTDIR)
        run: |
          stage="$(mktemp -d)"
          make install DESTDIR="$stage"
          test -x "$stage/usr/local/bin/keytap"
          test -f "$stage/usr/local/etc/keytap.conf.sample"
          test -f "$stage/usr/local/share/zsh/site-functions/_keytap"
          codesign --verify --strict "$stage/usr/local/bin/keytap"
